<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · Marcenaria Piata Norte</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="login.css">
</head>
<body id="pagina-login">
  <!-- Painel de imagem à esquerda. Coloque sua imagem em imagem-login.jpg. -->
  <aside id="painel-imagem" aria-label="Imagem da Marcenaria Piata Norte">
    <img src="imagem-login.jpg" alt="" id="imagem-login">
  </aside>

  <!-- Área do formulário à direita -->
  <main id="area-formulario">
    <div id="caixa-formulario">
      <a id="link-voltar-site" href="index.html">← Voltar ao site</a>

      <div id="titulo-formulario">
        <h1>Bem-vindo de volta!</h1>
        <p>Entre com seus dados para acessar sua conta.</p>
      </div>

      <!-- Demonstração: o formulário direciona para orcamentos.html, sem validação real de conta. -->
      <form id="formulario-login" action="orcamentos.html" method="get">
        <div class="campo">
          <label class="campo-rotulo" for="login-email">E-mail</label>
          <input class="campo-entrada" id="login-email" name="email" type="email" placeholder="seu@email.com" autocomplete="email" required>
        </div>

        <div class="campo">
          <div class="campo-rotulo-linha">
            <label class="campo-rotulo" for="login-senha">Senha</label>
            <a class="link-esqueci-senha" href="#">Esqueci minha senha</a>
          </div>
          <div class="campo-com-botao">
            <input class="campo-entrada" id="login-senha" name="senha" type="password" placeholder="••••••••" autocomplete="current-password" required>
            <button class="botao-mostrar-senha" id="botao-mostrar-senha" type="button" aria-controls="login-senha" aria-pressed="false">Mostrar</button>
          </div>
        </div>

        <button class="botao botao-vermelho botao-grande botao-largura-total" id="botao-entrar-conta" type="submit">Entrar na minha conta</button>
        <p id="chamada-cadastro">Não tem conta? <a href="cadastro.html">Cadastre-se grátis</a></p>
      </form>
    </div>
  </main>

  <script>
    /* Botão "Mostrar" / "Ocultar" da senha */
    (function () {
      var botao = document.getElementById('botao-mostrar-senha');
      var campo = document.getElementById('login-senha');
      botao.addEventListener('click', function () {
        var mostrando = campo.type === 'text';
        campo.type = mostrando ? 'password' : 'text';
        botao.textContent = mostrando ? 'Mostrar' : 'Ocultar';
        botao.setAttribute('aria-pressed', String(!mostrando));
      });
    })();
  </script>
</body>
</html>
